<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#e63329;--red-dark:#b52720;
  --bg:#0d0d0f;--surface:#161618;--surface2:#1e1e22;--surface3:#27272c;
  --text:#f0eff4;--muted:#8a8a96;--border:rgba(255,255,255,0.07);
  --green:#00e676;--gold:#f5c842;--yellow:#ffb300;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
.eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:.6rem}
header h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
header h1 span{color:var(--red)}
header p{margin-top:.6rem;color:var(--muted);font-size:.95rem}

/* CONTROLS (SEARCH & FILTER) */
.controls-container{max-width:1200px;margin:2rem auto 0;padding:0 1.5rem;display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:space-between}
@media(min-width: 768px){ .controls-container{flex-direction:row;} }

.search-box{position:relative;width:100%;max-width:400px}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;color:var(--text);font-size:.9rem;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(230,51,41,0.2)}

.filter-buttons{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:.6rem 1.2rem;font-size:.85rem;font-weight:600;border-radius:10px;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

/* GRID */
.container{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.25rem;max-width:1200px;margin:1.5rem auto 2.5rem;padding:0 1.5rem}
.no-results{grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:.95rem}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:rgba(230,51,41,.4)}
.card-img-wrap{background:var(--surface2);height:170px;display:flex;align-items:center;justify-content:center;padding:1.1rem;position:relative;overflow:hidden}
.card-img-wrap img{max-height:130px;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));transition:transform .3s}
.card:hover .card-img-wrap img{transform:scale(1.07)}
.rank-badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.card-body{padding:1rem 1.1rem 1.3rem;display:flex;flex-direction:column;flex:1}
.card-name{font-size:1rem;font-weight:700;line-height:1.2}
.card-sales{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.card-sales strong{color:var(--green);font-weight:600}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:.5rem}
.meta-year{font-size:.7rem;color:var(--muted);background:var(--surface3);padding:2px 7px;border-radius:4px}
.meta-maker{font-size:.7rem;color:var(--muted)}

/* Action Buttons Grid */
.btn-grid{display:grid;grid-template-columns:1fr 40px;gap:8px;margin-top:auto;padding-top:.85rem}
.btn-ver{width:100%;background:transparent;border:1px solid var(--red);color:var(--red);padding:.55rem 1rem;font-size:.82rem;font-weight:600;border-radius:8px;cursor:pointer;transition:background .2s,color .2s;letter-spacing:.03em}
.btn-ver:hover{background:var(--red);color:#fff}
.btn-info-console{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;transition:all .2s}
.btn-info-console:hover{background:var(--muted);color:var(--bg)}

/* MODAL OVERLAY */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(5px)}
.modal-overlay.active{display:flex}

/* MODAL BOX */
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;position:relative;animation:slideUp .22s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:1.3rem 1.5rem .9rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:1}
.modal-header h2{font-size:1.1rem;font-weight:700}
.close-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1.2rem;background:var(--surface2);border:none;transition:background .2s,color .2s;flex-shrink:0}
.close-btn:hover{background:var(--red);color:#fff}
.modal-body{padding:1.1rem 1.5rem 1.6rem}

/* SECTION TITLE */
.sec-title{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:.65rem}
.sec-title:not(:first-child){margin-top:1.4rem}

/* GAME LIST */
ul.game-list{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.game-list li{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.5rem .85rem;font-size:.84rem;display:flex;align-items:center;gap:10px;transition:border-color .15s}
ul.game-list li:hover{border-color:rgba(230,51,41,.3)}

/* GAME IMAGE */
.game-img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface3);flex-shrink:0;border:1px solid var(--border)}

.game-info{flex:1;min-width:0}
.game-name{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-rating{display:flex;align-items:center;gap:4px;margin-top:2px}
.stars{color:var(--gold);font-size:.7rem;letter-spacing:1px}
.score-num{font-size:.7rem;color:var(--muted)}
.score-badge{font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:2px}
.score-green{background:#1a3d22;color:#00e676}
.score-yellow{background:#3d2e00;color:#ffb300}
.score-red{background:#3d1a1a;color:#ff6b6b}

/* Game Info Trigger Button */
.btn-game-details{background:var(--surface3);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.75rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.btn-game-details:hover{color:var(--text);border-color:var(--red);background:rgba(230,51,41,0.1)}

/* INFO DESCRIPTIONS FOR DETAILS BOX */
.info-text-box{background:var(--surface2);border:1px solid var(--border);padding:1rem;border-radius:12px;font-size:0.9rem;line-height:1.5;color:var(--text)}
.info-detail-item{margin-bottom:0.75rem}
.info-detail-item strong{color:var(--red)}

/* FOOTER */
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:1rem}
</style>
</head>

      {name:"Sekiro: Shadows Die Twice", score:90, image:"https://m.media-amazon.com/images/I/716DQ6dS9XL._AC_UF1000,1000_QL80_.jpg", genre:"Ação/Aventura", details:"Um combate rítmico frenético de espadas e rebatidas milimétricas ambientado no Japão mitológico da era Sengoku."},
      {name:"Doom Eternal", score:88, image:"https://store-images.s-microsoft.com/image/apps.33238.14607483449828807.1bf8995c-7221-490e-a6d4-8718054337ce.b335eb86-4cf4-4aca-96ec-8a1dbc19e496", genre:"Tiro em 1ª Pessoa", details:"Uma dança de combate veloz e agressiva contra demônios onde parar de correr significa morte instantânea."},
      {name:"Control", score:82, image:"https://store-images.s-microsoft.com/image/apps.3830.14595226950892239.a8daf266-2756-4f3f-9606-6b7b7cef7920.4911518a-4a55-43bb-b9ba-972ae1946dd5", genre:"Ação/Ficção", details:"Aventura paranormal misteriosa dentro de um prédio mutável usando poderes de telecinese e deformação física de cenários."},
    ]
  }
];

// Estado atual de filtros e buscas
let currentMakerFilter = 'all';
let currentSearchQuery = '';

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────
function scoreColor(s){
  if(s>=85) return 'score-green';
  if(s>=70) return 'score-yellow';
  return 'score-red';
}
function scoreStars(s){
  const full = Math.round(s/20);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

// ──────────────────────────────────────────────
//  RENDER CARDS
// ──────────────────────────────────────────────
//  RENDER CARDS (Substitua apenas esta função)
// ──────────────────────────────────────────────
function renderCards(){
  const container = document.getElementById('container');
  container.innerHTML='';

  const filteredData = consolesData.filter(c => {
    // Mantém o filtro original por marca (Sony, Nintendo, Microsoft)
    const matchMaker = (currentMakerFilter === 'all' || c.maker.toLowerCase() === currentMakerFilter.toLowerCase());
    
    // Captura o termo digitado na pesquisa
    const query = currentSearchQuery.toLowerCase().trim();
    
    // 1. Procura pelo nome do console
    const matchConsoleName = c.name.toLowerCase().includes(query);
    
    // 2. Procura se a busca bate com o Nome OU Gênero dos jogos exclusivos
    const matchExclusiveGames = c.exclusives.some(g => 
      g.name.toLowerCase().includes(query) || (g.genre && g.genre.toLowerCase().includes(query))
    );
    
    // 3. Procura se a busca bate com o Nome OU Gênero dos jogos populares
    const matchPopularGames = c.popular.some(g => 
      g.name.toLowerCase().includes(query) || (g.genre && g.genre.toLowerCase().includes(query))
    );
    
    // Retorna o console se ele for da marca certa E se bater com o console ou algum jogo/gênero
    return matchMaker && (matchConsoleName || matchExclusiveGames || matchPopularGames);
  });

  if(filteredData.length === 0) {
    container.innerHTML = `<div class="no-results">Nenhum console encontrado para os critérios inseridos.</div>`;
    return;
  }

  filteredData.forEach(c=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-img-wrap" onclick="openModal('${c.id}')">
        <span class="rank-badge">${c.rank}</span>
        <img src="${c.image}" alt="${c.name}" loading="lazy"
             onerror="this.style.opacity='.25';this.removeAttribute('onerror')">
      </div>
      <div class="card-body">
        <div class="card-name" onclick="openModal('${c.id}')">${c.name}</div>
        <div class="card-sales">Vendas: <strong>${c.sales}</strong></div>
        <div class="card-meta">
          <span class="meta-year">${c.year}</span>
          <span class="meta-maker">${c.maker}</span>
        </div>
        <div class="btn-grid">
          <button class="btn-ver" onclick="openModal('${c.id}')">Ver Jogos</button>
          <button class="btn-info-console" title="Ver Detalhes do Console" onclick="openConsoleDetails('${c.id}')">ℹ</button>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

// ──────────────────────────────────────────────
//  CONTROLS HANDLERS
// ──────────────────────────────────────────────
function filterMaker(maker) {
  document.body.classList.remove('tema-sony', 'tema-microsoft', 'tema-nintendo');
  if (maker.toLowerCase() === 'sony') {
    document.body.classList.add('tema-sony');
  } else if (maker.toLowerCase() === 'microsoft') {
    document.body.classList.add('tema-microsoft');
  } else if (maker.toLowerCase() === 'nintendo') {
    document.body.classList.add('tema-nintendo');
  }
  currentMakerFilter = maker;
  
  const buttons = document.querySelectorAll('.filter-btn');
  buttons.forEach(btn => {
    if(btn.textContent.trim() === maker || (maker === 'all' && btn.textContent.trim() === 'Todos')) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  
  renderCards();
}

function handleSearch() {
  currentSearchQuery = document.getElementById('searchInput').value;
  renderCards();
}

// ──────────────────────────────────────────────
//  RENDER GAME LIST ITEM
// ──────────────────────────────────────────────
function gameItemHTML(consoleId, game, type, index){
  const col = scoreColor(game.score);
  
  const imgEl = (game.image && game.image !== 'LINK_DA_IMAGEM')
    ? `<img class="game-img" src="${game.image}" alt="${game.name}" onerror="this.style.display='none'">` 
    : `<div class="game-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)">🎮</div>`;

  return `
    <li>
      ${imgEl}
      <div class="game-info">
        <div class="game-name">${game.name}</div>
        <div class="game-rating">
          <span class="stars">${scoreStars(game.score)}</span>
          <span class="score-num">${game.score}/100</span>
          <span class="score-badge ${col}">${col==='score-green'?'Ótimo':col==='score-yellow'?'Bom':'Regular'}</span>
        </div>
      </div>
      <button class="btn-game-details" title="Ver Detalhes do Jogo" onclick="openGameDetails('${consoleId}', '${type}', ${index})">ℹ</button>
    </li>`;
}

// ──────────────────────────────────────────────
//  OPEN MODALS
// ──────────────────────────────────────────────
function openModal(id){
  const c = consolesData.find(x=>x.id===id);
  if(!c) return;
  document.getElementById('modalTitle').textContent = `Jogos de ${c.name}`;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <p class="sec-title">Exclusivos de Peso</p>
    <ul class="game-list" id="excList">
      ${c.exclusives.map((g, idx)=>gameItemHTML(id, g, 'exclusives', idx)).join('')}
    </ul>
    <p class="sec-title">Outros Sucessos</p>
    <ul class="game-list" id="popList">
      ${c.popular.map((g, idx)=>gameItemHTML(id, g, 'popular', idx)).join('')}
    </ul>`;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow='hidden';
}

function openConsoleDetails(id) {
  const c = consolesData.find(x=>x.id===id);
  if(!c) return;
  
  document.getElementById('modalTitle').textContent = `Detalhes: ${c.name}`;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="info-text-box">
      <div class="info-detail-item"><strong>Fabricante:</strong> ${c.maker}</div>
      <div class="info-detail-item"><strong>Ano de Lançamento:</strong> ${c.year}</div>
      <div class="info-detail-item"><strong>Volume de Vendas:</strong> ${c.sales}</div>
      <div class="info-detail-item"><strong>Status Histórico:</strong> ${c.rank}</div>
      <hr style="border:0; border-top:1px solid var(--border); margin:1rem 0;">
      <p style="color:var(--text)">${c.description || 'Informações detalhadas não cadastradas.'}</p>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow='hidden';
}

function openGameDetails(consoleId, type, index) {
  const c = consolesData.find(x=>x.id===consoleId);
  if(!c) return;
  const game = c[type][index];
  if(!game) return;

  document.getElementById('modalTitle').textContent = game.name;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div style="display:flex; gap:15px; margin-bottom:1.5rem; background:var(--surface2); padding:1rem; border-radius:12px; border:1px solid var(--border)">
      <img src="${game.image}" alt="${game.name}" style="max-width:100px; max-height:140px; border-radius:6px; object-fit:contain; background:var(--surface3)">
      <div>
        <p class="info-detail-item" style="margin-top:0.5rem"><strong>Gênero:</strong> ${game.genre || 'Não informado'}</p>
        <p class="info-detail-item"><strong>Avaliação Metacritic:</strong> <span class="score-badge ${scoreColor(game.score)}" style="padding:2px 6px; border-radius:4px; font-weight:bold">${game.score}/100</span></p>
      </div>
    </div>
    <p class="sec-title">Resumo / Detalhes</p>
    <div class="info-text-box">
      <p>${game.details || 'Sem detalhes descritivos adicionais cadastrados para este título.'}</p>
    </div>
    <button class="btn-ver" style="margin-top:1.5rem" onclick="openModal('${consoleId}')">← Voltar para a lista</button>
  `;
}

// ──────────────────────────────────────────────
//  CLOSE MODAL
// ──────────────────────────────────────────────
function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow='';
}
document.getElementById('closeBtn').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ──────────────────────────────────────────────
//  SISTEMA DO PAINEL ADMINISTRATIVO (CRUD)
// ──────────────────────────────────────────────
let isPanelOpen = false;

function toggleAdminPanel() {
  const panel = document.getElementById('adminPanel');
  isPanelOpen = !isPanelOpen;
  panel.classList.toggle('active', isPanelOpen);
  if(isPanelOpen) populateAdminConsoleSelect();
}

function populateAdminConsoleSelect() {
  const selectConsole = document.getElementById('admConsoleSelect');
  selectConsole.innerHTML = '<option value="">-- Selecione o Console --</option>';
  consolesData.forEach(c => {
    selectConsole.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
  document.getElementById('admGameSelect').innerHTML = '<option value="">-- Selecione o Jogo --</option>';
  clearAdminForm();
}

function handleAdminConsoleChange() {
  const consoleId = document.getElementById('admConsoleSelect').value;
  const gameSelect = document.getElementById('admGameSelect');
  gameSelect.innerHTML = '<option value="">-- Selecione o Jogo --</option>';
  clearAdminForm();
  
  if(!consoleId) return;
  const c = consolesData.find(item => item.id === consoleId);
  
  c.exclusives.forEach((g, idx) => {
    gameSelect.innerHTML += `<option value="exclusives-${idx}">[Exclusivo] ${g.name}</option>`;
  });
  c.popular.forEach((g, idx) => {
    gameSelect.innerHTML += `<option value="popular-${idx}">[Popular] ${g.name}</option>`;
  });
}

function handleAdminGameChange() {
  const consoleId = document.getElementById('admConsoleSelect').value;
  const gameValue = document.getElementById('admGameSelect').value;
  
  if(!consoleId || !gameValue) { clearAdminForm(); return; }
  
  const [category, index] = gameValue.split('-');
  const c = consolesData.find(item => item.id === consoleId);
  const game = c[category][index];
  
  document.getElementById('admInputName').value = game.name;
  document.getElementById('admInputScore').value = game.score;
}

function clearAdminForm() {
  document.getElementById('admInputName').value = '';
  document.getElementById('admInputScore').value = '';
}

function saveAdminChanges() {
  const consoleId = document.getElementById('admConsoleSelect').value;
  const gameValue = document.getElementById('admGameSelect').value;
  const newName = document.getElementById('admInputName').value.trim();
  const newScore = parseInt(document.getElementById('admInputScore').value);

  if(!consoleId || !gameValue || !newName || isNaN(newScore)) {
    alert("Por favor, selecione o jogo e preencha todos os campos corretamente.");
    return;
  }

  const [category, index] = gameValue.split('-');
  const c = consolesData.find(item => item.id === consoleId);
  
  // Update (U do CRUD)
  c[category][index].name = newName;
  c[category][index].score = newScore;
  
  alert("Jogo modificado com sucesso!");
  
  // Recarrega a tela usando a sua função original
  if(typeof renderCards === "function") renderCards(); 
  
  // Atualiza o modal de lista se ele estiver aberto na tela
  if(document.getElementById('modal').classList.contains('active')) {
    openModal(consoleId); 
  }
  toggleAdminPanel();
}

function deleteAdminGame() {
  const consoleId = document.getElementById('admConsoleSelect').value;
  const gameValue = document.getElementById('admGameSelect').value;

  if(!consoleId || !gameValue) {
    alert("Selecione um jogo primeiro para poder excluí-lo.");
    return;
  }

  if(confirm("Tem certeza que deseja deletar este jogo do site?")) {
    const [category, index] = gameValue.split('-');
    const c = consolesData.find(item => item.id === consoleId);
    
    // Delete (D do CRUD)
    c[category].splice(index, 1);
    
    alert("Jogo excluído permanentemente!");
    
    // Recarrega a tela usando a sua função original
    if(typeof renderCards === "function") renderCards();
    
    // Atualiza o modal de lista se ele estiver aberto na tela
    if(document.getElementById('modal').classList.contains('active')) {
      openModal(consoleId);
    }
    toggleAdminPanel();
  }
}

// Inicializar os Cards Originais do seu site
renderCards();
</script>

<!-- BOTÃO DO PAINEL ADM (Fixado no canto superior direito) -->
<button class="adm-trigger-btn" onclick="toggleAdminPanel()">⚙️ Painel ADM</button>

<!-- MENU LATERAL RETRÁTIL DO PAINEL ADM -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-panel-header">
    <h3>Painel do Administrador</h3>
    <button onclick="toggleAdminPanel()">×</button>
  </div>
  <div class="admin-panel-body">
    <label>1. Escolha o Console:</label>
    <select id="admConsoleSelect" onchange="handleAdminConsoleChange()"></select>

    <label>2. Escolha o Jogo:</label>
    <select id="admGameSelect" onchange="handleAdminGameChange()">
      <option value="">-- Selecione o Jogo --</option>
    </select>

    <label>Novo Nome do Jogo:</label>
    <input type="text" id="admInputName" placeholder="Ex: Resident Evil 4 Remake">

    <label>Nova Nota (Metacritic):</label>
    <input type="number" id="admInputScore" min="0" max="100" placeholder="Ex: 95">

    <div class="admin-actions">
      <button class="adm-btn-save" onclick="saveAdminChanges()">Salvar Alterações</button>
      <button class="adm-btn-delete" onclick="deleteAdminGame()">Excluir Jogo</button>
    </div>
  </div>
</div>

</body>
