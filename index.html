<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo dos Videogames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 Universo dos Videogames</h1>
        <p>Descubra os consoles mais vendidos da história, seus maiores sucessos e os grandes exclusivos.</p>
    </header>

    <main>
        <section class="controls-list">
            <h2>Selecione um Console para ver os detalhes:</h2>
            <div class="buttons-container">
                <button onclick="mostrarDados('ps2')">PlayStation 2</button>
                <button onclick="mostrarDados('switch')">Nintendo Switch</button>
                <button onclick="mostrarDados('ps5')">PlayStation 5</button>
            </div>
        </section>

        <section id="detalhes-console" class="hidden">
            <h2 id="titulo-console">Escolha um videogame acima</h2>
            <div class="info-grupo">
                <h3>🏆 Jogos Mais Comprados</h3>
                <ul id="jogos-populares"></ul>
            </div>
            <div class="info-grupo">
                <h3>💎 Jogos Exclusivos</h3>
                <ul id="jogos-exclusivos"></ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
