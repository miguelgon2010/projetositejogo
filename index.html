<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo dos Games | Consoles Mais Vendidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mundo dos Games</h1>
        <p>Os consoles mais comprados do mercado e seus principais títulos</p>
    </header>

    <!-- O JavaScript vai usar este container para desenhar os cards com as imagens -->
    <main class="container">
        <!-- Os cards serão gerados dinamicamente aqui -->
    </main>

    <!-- Modal para exibir os jogos do console selecionado -->
    <div id="gamesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Jogos do Console</h2>
            
            <h3>Exclusivos de Peso</h3>
            <ul id="exclusiveGamesList"></ul>

            <h3>Outros Sucessos</h3>
            <ul id="popularGamesList"></ul>
        </div>
    </div>

    <!-- Vinculação do arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
